name: surveyor2
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.23,<=1.26.4
  - pillow>=9
  - pip
  - pytest>=7
  - pytest-cov>=4
  - pip:
      # PyTorch with CUDA 12.4 support - install from PyTorch index
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.0,<2.6
      - torchvision>=0.15
      - torchaudio>=2.0
      # Runtime dependencies
      - imageio[ffmpeg]>=2.35
      - pyyaml>=6.0
      - tqdm>=4.65
      # LPIPS
      - lpips>=0.1.4
      # CLIPScore
      - open_clip_torch>=2.24.0
      - clip @ git+https://github.com/openai/CLIP.git
      - opencv-python>=4.8
      # VBench
      - vbench>=0.1.0
      - timm>=0.6.0
      - einops>=0.7.0